name: unrent
description: Annotate pull requests where the code selects an AI model that is retired or retiring, or calls a closed AI service, and fail the build on what you choose.
author: stringcutter

inputs:
  path:
    description: Directory or file to scan.
    default: .
  fail-on:
    description: "Fail on any of: snapped (a selected model is retired), snaps (a selected model has a retirement date), closed (any closed AI service). A comma list; empty never fails."
    default: ""
  within:
    description: With fail-on snaps, only retirements due within this many days.
    default: ""
  upload-sarif:
    description: Upload unrent.sarif to GitHub code scanning (needs `security-events write`).
    default: "true"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        WITHIN: ${{ inputs.within }}
      run: |
        args=(--format sarif --output unrent.sarif)
        if [ -n "$FAIL_ON" ]; then args+=(--fail-on "$FAIL_ON"); fi
        if [ -n "$WITHIN" ]; then args+=(--within "$WITHIN"); fi
        uvx --from "unrent>=0.3.0" unrent scan "$SCAN_PATH" "${args[@]}"
    # Also when fail-on failed the scan: the annotations show why.
    - if: ${{ !cancelled() && inputs.upload-sarif == 'true' && hashFiles('unrent.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: unrent.sarif
        category: unrent
