# Held-out corpus: repos unrent is never tuned against, so their scores say how it does
# on code nobody fitted it to. Labelled 2026-10-07 by independent annotators from the
# code at the pinned commit, under TRUTH_RULES.md and OSS_TRUTH_RULES.md, before unrent
# was run on them. Same keys as corpus.yaml plus the open_source_* keys inline.
#
# Measure, don't tune: `python run_eval.py --holdout`. A fix made because of a miss here
# moves that repo into corpus.yaml (and a fresh repo replaces it), so this set stays
# unseen. No floors apply.
version: 1
repos:
