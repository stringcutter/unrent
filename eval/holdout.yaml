    own code/config selects or configures: MODEL_ALIASES (aider/models.py:99-123), provider key maps (aider/models.py:723-731,
    773-778), onboarding default-model selection by env key (aider/onboarding.py:63-68), provider-specific code
    paths (bedrock boto3 check, vertex aiplatform check, OpenRouter OAuth + model DB, GitHub Copilot token exchange,
    Ollama num_ctx) and the shipped per-model settings aider/resources/model-settings.yml (prefixes: openrouter
    85, openai 50, azure 38, vertex_ai 25, gemini 22, bedrock 11, anthropic 9, bedrock_converse 8, xai 5, fireworks_ai
