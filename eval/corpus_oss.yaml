#   open_source_expected     catalog `projects:` repos the code uses, deploys or supports as a
#                            selectable backend
#   open_source_tests_only   subset of expected used only in tests
#   open_source_uncertain    ambiguous (reasons in open_source_uncertain_reasons); not scored
