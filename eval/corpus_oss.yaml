  notes: 'Provider enumeration (server/utils/helpers/index.js switch). LLM: openai, azure, anthropic, gemini, vertex, bedrock,
    cohere, mistral, xai, deepseek, groq, togetherai, fireworksai, cerebras, perplexity, openrouter, moonshotai, zai, minimax,
    sambanova -> closed ids; ollama, localai, litellm -> OSS; lmstudio, koboldcpp, textgenwebui, lemonade, foundry (Microsoft
    Foundry Local on 127.0.0.1:55776, NOT azure-ai-foundry), nvidia-nim (local NIM), omlx, llmman -> coverage_gaps; generic-openai
    -> nothing (rule 7); apipie (apipie.ai), novita (api.novita.ai), ppio (api.ppinfra.com), cometapi (api.cometapi.com),
    giteeai (ai.gitee.com), privatemode (local proxy for Privatemode confidential AI) have no catalog id; anythingllm-router
    is an internal router over the other providers. Embedders: openai, azure, gemini, mistral, cohere, voyageai, openrouter
    closed; ollama, localai, litellm OSS; native = transformers.js; lmstudio, lemonade gaps; generic-openai nothing. Vector
    DBs: lancedb (default), chroma, qdrant, weaviate, milvus, pgvector OSS; pinecone, astra, zilliz closed; chromacloud (CloudClient,
    CHROMACLOUD_API_KEY) is hosted Chroma Cloud with no catalog id (chroma-core/chroma expected anyway via self-hosted "chroma").
    Image gen: openai (gpt-image-1), openrouter closed; ollama, localai OSS; lemonade gap. TTS: openai, elevenlabs closed;
    kokoro -> Kokoro-FastAPI; native Piper in browser (piper-tts-web is a WASM port of rhasspy/piper, mapped to OHF-Voice/piper1-gpl
    as the successor project - scorer may treat as borderline); generic-openai nothing. STT: openai, groq, deepgram closed;
    lemonade gap (server/utils/SpeechToText/helpers.js:10 whisper.cpp mention is a comment about Lemonade backend, not counted);
    collector local whisper = Whisper ONNX via transformers.js. Agent web search: serpapi, serper, bing, tavily, exa, perplexity,
    brave, you.com (keyless default), firecrawl closed; searxng OSS; searchapi.io, serply.io, Baidu Qianfan search, fastCRW,
    Keenable, AnySearch, DuckDuckGo html have no catalog id. Native models are downloaded from huggingface.co / cdn.anythingllm.com
    (hub download, not huggingface-inference). open-computer sub-project: Pi coding agent with OpenAI default (gpt-4o, api.openai.com)
    or any OPENAI_BASE_URL (LM Studio/Ollama mentioned only in error strings in utils/llm-error.js). open-computer/master/setup/themes
    (~4000 icon files) is theme assets. browser-extension and embed are git submodules with no tracked content. Deployments
    (docker-compose, helm, k8s, cloudformation, terraform, HF spaces, openshift) only run the mintplexlabs/anythingllm image;
    no AI sidecars. Doc-only/comment mentions rejected: README.md:85 "Any open-source llama.cpp compatible model" (no llama.cpp
    binding in server), README.md:91 NVIDIA NIM build.nvidia.com, README.md:149 rhasspy/piper link, server/utils/AiProviders/omlx/index.js:66
    "vLLM-compatible max_model_len" comment (vLLM not counted), cloud-deployments/huggingface-spaces/Dockerfile HF Spaces
    comments. Declared but not directly imported: pinecone-client (server/package.json, superseded by @pinecone-database/pinecone),
    onnxruntime-web (frontend/package.json, used under piper-tts-web).'
