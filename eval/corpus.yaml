# Golden corpus for unrent detection accuracy (service level).
# Ground truth was labelled by hand from each repo's code/config at the pinned commit,
# independently of unrent's output. Rules: TRUTH_RULES.md.
#   expected   closed services the project's own code/config calls or is configured for
#   tests_only subset of expected used only in tests
#   uncertain  genuinely ambiguous ids (reasons in uncertain_reasons); not scored by default
# An empty `expected` list marks a negative (open/self-hosted only) repo.
version: 1
repos:
- name: android__ai-samples
