name: eval

# The golden corpus: 54 real repos, pinned to a commit, with hand-labelled truth for
# closed services (eval/corpus.yaml, eval/TRUTH_RULES.md) and open source components
# (eval/corpus_oss.yaml, eval/OSS_TRUTH_RULES.md). A change to detection or to the
# catalog must not make unrent worse at telling what a codebase depends on.
on:
  push:
    branches: [main]
    paths: ["unrent/**", "catalog/services/**", "catalog/alternatives.yaml", "eval/**"]
  pull_request:
    paths: ["unrent/**", "catalog/services/**", "catalog/alternatives.yaml", "eval/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval/.cache
          key: eval-corpus-${{ hashFiles('eval/corpus.yaml', 'eval/corpus_oss.yaml') }}
      # Floors sit just under the measured scores on 2026-09-26: closed precision 0.993,
      # recall 0.953; open source precision 1.000, recall 0.902. Raise them when the
      # scores rise; never lower them to pass.
      - run: >-
          uv run --frozen python eval/run_eval.py --side both
          --min-precision 0.98 --min-recall 0.94
          --min-oss-precision 0.98 --min-oss-recall 0.88
