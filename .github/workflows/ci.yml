name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      # With ripgrep on Ubuntu, every detection test runs in both search modes and
      # must give identical results; elsewhere only the pure-Python mode runs.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y ripgrep
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run lockin catalog --validate
      - name: lockin finds nothing in lockin
        shell: bash
        run: |
          uv run lockin scan . --format json -o scan.json
          python -c "import json,sys; f=json.load(open('scan.json'))['found']; sys.exit(len(f))"
