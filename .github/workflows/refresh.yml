name: refresh rankings

# Weekly: record every alternative's star count, re-rank the pools, open a pull request
# and merge it. Momentum is computed from this history, so a skipped week costs
# accuracy, not correctness. A week with catalog problems is left open for review.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests" to be enabled, or the last step fails.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-rankings
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'stringcutter/unrent'  # not on forks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Sync first so uv's own progress lines do not end up in the pull request body.
      - run: uv sync --frozen
      - name: Rank
        id: rank
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Exit 3: rankings written, but a listed project is missing, renamed, archived,
        # inactive or no longer open source; the pull request says so. Anything else
        # non-zero (a crash, or exit 4: a pool collapsed and nothing was written)
        # fails the run, so an outage is not mistaken for a quiet week.
        run: |
          set +e
          uv run --frozen python scripts/refresh.py 2> problems.txt
          code=$?
          set -e
          cat problems.txt >&2
          if [ "$code" -eq 3 ]; then
            echo "problems=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      # Pull requests opened with GITHUB_TOKEN do not trigger ci.yml, so the new
      # snapshot is validated here, before anyone is asked to merge it.
      - name: Validate
        run: |
          uv run --frozen unrent catalog --validate
          uv run --frozen pytest -q
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          branch: refresh-rankings
          delete-branch: true
          commit-message: "Refresh rankings"
          title: "Refresh rankings${{ steps.rank.outputs.problems && ' (catalog needs attention)' || '' }}"
          body-path: problems.txt
          add-paths: |
            catalog/rankings.json
            catalog/star-history.json
      # A quiet week merges itself: the snapshot was validated and tested above, and
      # merging is what advances the star history. A week with catalog problems stays
      # open for a human, with the problems in its description.
      - name: Merge
        if: steps.pr.outputs.pull-request-number && steps.rank.outputs.problems != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch

  # Every package name in the catalog must still exist in its registry: a renamed or
  # removed package is a silent false negative. Separate from the ranking job, so a
  # catalog problem does not cost a week of star history.
  packages:
    if: github.repository == 'stringcutter/unrent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --frozen python scripts/verify_packages.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Swift packages are GitHub repos

  # Hosted model providers appear every week. models.dev (https://models.dev) lists them
  # with their API URL, key names and npm package; catalog/services/models-dev.yaml holds
  # those the hand-written catalog does not know, regenerated here. The new catalog has
  # to pass the golden corpus with the eval's own floors before it is proposed, and a
  # pull request opened with GITHUB_TOKEN does not trigger eval.yml, so the corpus runs
  # in this job. A passing week merges itself, like the rankings. The pull request body
  # lists the providers, and the new endpoints of vendors the catalog already knows,
  # which a person adds to the hand-written entry.
  new-services:
    if: github.repository == 'stringcutter/unrent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - run: uv sync --frozen
      - name: Regenerate from models.dev
        run: uv run --frozen python scripts/new_services.py --models-dev --write-catalog > new-services.md
      - name: Validate
        run: |
          uv run --frozen unrent catalog --validate
          uv run --frozen pytest -q
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval/.cache
          key: eval-corpus-${{ hashFiles('eval/corpus.yaml', 'eval/corpus_oss.yaml') }}
      - name: Golden corpus
        run: >-
          uv run --frozen python eval/run_eval.py --side all
          --min-precision 0.98 --min-recall 0.94
          --min-oss-precision 0.98 --min-oss-recall 0.88
          --min-model-precision 0.93 --min-model-recall 0.88
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          branch: models-dev-catalog
          delete-branch: true
          commit-message: "Catalog: hosted providers from models.dev"
          title: "Catalog: hosted providers from models.dev"
          body-path: new-services.md
          add-paths: catalog/services/models-dev.yaml
      - name: Merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch

  # Model retirements from the vendors' own pages (scripts/retirements.py), for
  # `snapped`. A new or moved date changes what every scan tells its users, and a page
  # whose layout changed shows up as ids that are gone, so the pull request is left
  # open for a person to read. The tests run first.
  retirements:
    if: github.repository == 'stringcutter/unrent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - name: Rewrite from the vendors' pages
        run: uv run --frozen python scripts/retirements.py --write > retirements.md
      - name: Validate
        run: |
          uv run --frozen unrent catalog --validate
          uv run --frozen pytest -q
      # An id the corpus labels can drop off a page; the models side would only notice
      # after the merge, since this pull request does not trigger eval.yml.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval/.cache
          key: eval-corpus-${{ hashFiles('eval/corpus.yaml', 'eval/corpus_oss.yaml') }}
      - name: Golden corpus
        run: >-
          uv run --frozen python eval/run_eval.py --side models --quiet
          --min-model-precision 0.93 --min-model-recall 0.88
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: model-retirements
          delete-branch: true
          commit-message: "Catalog: model retirements from the vendors' pages"
          title: "Catalog: model retirements from the vendors' pages"
          body-path: retirements.md
          add-paths: catalog/retirements.yaml
