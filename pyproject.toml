[project]
name = "unrent"
version = "0.2.0"
description = "Find the rented parts of your AI stack. Swap them for open source. Rank the open source you already run."
readme = "README.md"
requires-python = ">=3.11"  # tomllib
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Niklas Mellgren" }]
keywords = [
    "ai", "llm", "vendor-lock-in", "open-source", "alternatives", "dependency-scanner",
    "openai", "static-analysis", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# `unrent mcp`: the scanner as an MCP server for coding agents.
mcp = ["mcp>=2.2,<3"]

[project.urls]
Homepage = "https://github.com/niklasmellgren/unrent"
Source = "https://github.com/niklasmellgren/unrent"
Issues = "https://github.com/niklasmellgren/unrent/issues"
Changelog = "https://github.com/niklasmellgren/unrent/blob/main/CHANGELOG.md"

[project.scripts]
unrent = "unrent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mcp>=2.2,<3"]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unrent"]
# star-history.json is only read by scripts/refresh.py; it grows weekly and is not shipped.
[tool.hatch.build.targets.wheel.force-include]
"catalog/services" = "unrent/catalog_data/services"
"catalog/alternatives.yaml" = "unrent/catalog_data/alternatives.yaml"
"catalog/rankings.json" = "unrent/catalog_data/rankings.json"

[tool.hatch.build.targets.sdist]
include = ["unrent/", "catalog/", "tests/", "scripts/", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are file contents; wrapping them hides what is being tested.
"tests/*" = ["E501", "RUF001"]
# Rankings are dated by the maintainer's calendar day; a timezone adds nothing.
"scripts/*" = ["DTZ011"]
# Report tables are wide format strings.
"eval/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
