[project]
name = "lockin"
version = "0.1.0"
description = "Scan a codebase for closed AI dependencies and name the open source replacements."
readme = "README.md"
requires-python = ">=3.11"  # tomllib
license = "Apache-2.0"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
lockin = "lockin.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lockin"]
force-include = { "catalog" = "lockin/catalog_data" }

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ", "RUF", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
