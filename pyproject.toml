[project]
name = "lockin"
version = "0.2.0"
description = "Find the closed AI services a codebase depends on, and the open source alternatives that replace them."
readme = "README.md"
requires-python = ">=3.11"  # tomllib
license = "Apache-2.0"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
lockin = "lockin.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lockin"]
force-include = { "catalog" = "lockin/catalog_data" }

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are file contents; wrapping them hides what is being tested.
"tests/*" = ["E501", "RUF001"]
# Rankings are dated by the maintainer's calendar day; a timezone adds nothing.
"scripts/*" = ["DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
