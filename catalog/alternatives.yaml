      - {repo: Portkey-AI/gateway, what: Fast AI gateway with routing, retries and guardrails}
      - {repo: maximhq/bifrost, what: High-performance LLM gateway written in Go}
      - {repo: songquanpeng/one-api, what: "Unified OpenAI-compatible API over many providers, with key management"}
      - {repo: QuantumNous/new-api, what: "LLM gateway and key management, successor fork of one-api"}
      - {repo: theagentrouter/agent-router, what: AI gateway built on Envoy Proxy}
      - {repo: Helicone/helicone, what: "Observability platform with a built-in AI gateway"}

  - id: fine-tuning
    name: Fine-tuning framework
    source: github
    projects:
      - {repo: unslothai/unsloth, what: "Fast, memory-efficient fine-tuning and RL for open models"}
      - {repo: hiyouga/LlamaFactory, what: "Unified fine-tuning of 100+ LLMs, with a web UI"}
      - {repo: axolotl-ai-cloud/axolotl, what: Config-driven fine-tuning for open models}
      - {repo: huggingface/trl, what: "Post-training with SFT, DPO, GRPO and more"}
      - {repo: meta-pytorch/torchtune, what: PyTorch-native post-training library}
      - {repo: verl-project/verl, what: Reinforcement learning for LLMs at scale}

  - id: guardrails
    name: Guardrails and moderation
    source: github
    projects:
      - {repo: NVIDIA-NeMo/Guardrails, what: Programmable guardrails for LLM applications, licence: Apache-2.0}
      - {repo: guardrails-ai/guardrails, what: Input and output validation for LLMs}

