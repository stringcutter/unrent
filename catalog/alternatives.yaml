      - {repo: letta-ai/letta, what: Stateful agents with long-term memory}
      - {repo: topoteretes/cognee, what: Memory for AI agents from documents and conversations}

# How to recognise the open source projects above when a codebase already uses them,
# so a scan can say where the component it runs stands in its pool. Keyed by repo; a
# project listed in several pools is described once. `kind` keeps comparisons honest:
# faiss is a library, qdrant a server, pgvector a Postgres extension.
#
# Self-hosted servers are mostly run from images, so `image` (compose, Kubernetes,
# Dockerfile FROM) matters as much as packages here. Projects whose SDK is also the
# client for the vendor's hosted service (e2b, Firecrawl) are recognised by their
# self-host image only; Playwright is left out, because it is in every web test suite.

projects:
  # ---------------------------------------------------------------- vector databases
  facebookresearch/faiss:
    kind: [library, embedded]
    detect:
      requirement: [faiss-cpu, faiss-gpu, faiss-gpu-cu12]
      python_import: [faiss, langchain_community.vectorstores.FAISS,
                      langchain.vectorstores.FAISS]
      npm: [faiss-node]
      symbol: [FaissStore]
  qdrant/qdrant:
    kind: [server]
    detect:
      requirement: [qdrant-client, langchain-qdrant, llama-index-vector-stores-qdrant]
      python_import: [qdrant_client]
      npm: ["@qdrant/js-client-rest", "@qdrant/qdrant-js", "@langchain/qdrant"]
      go: [github.com/qdrant/go-client]
      cargo: [qdrant-client]
      maven: ["io.qdrant:client", "dev.langchain4j:langchain4j-qdrant",
              "org.springframework.ai:spring-ai-starter-vector-store-qdrant",
              "org.springframework.ai:spring-ai-qdrant-store"]
      nuget: [Qdrant.Client, Microsoft.SemanticKernel.Connectors.Qdrant]
      image: [qdrant/qdrant]
  milvus-io/milvus:
    kind: [server]
    detect:
      requirement: [pymilvus, milvus-lite, langchain-milvus, llama-index-vector-stores-milvus]
      python_import: [pymilvus]
      npm: ["@zilliz/milvus2-sdk-node"]
      go: [github.com/milvus-io/milvus-sdk-go, github.com/milvus-io/milvus/client]
      maven: ["io.milvus:milvus-sdk-java", "dev.langchain4j:langchain4j-milvus",
              "org.springframework.ai:spring-ai-starter-vector-store-milvus",
              "org.springframework.ai:spring-ai-milvus-store"]
      image: [milvusdb/milvus]
  weaviate/weaviate:
    kind: [server]
    detect:
      requirement: [weaviate-client, langchain-weaviate, llama-index-vector-stores-weaviate]
      python_import: [weaviate]
      npm: [weaviate-client, weaviate-ts-client, "@langchain/weaviate"]
      go: [github.com/weaviate/weaviate-go-client]
      image: [semitechnologies/weaviate, cr.weaviate.io/semitechnologies/weaviate]
      maven: ["dev.langchain4j:langchain4j-weaviate", "io.weaviate:client",
              "org.springframework.ai:spring-ai-starter-vector-store-weaviate",
              "org.springframework.ai:spring-ai-weaviate-store"]
  chroma-core/chroma:
    kind: [embedded, server]
    detect:
      requirement: [chromadb, chromadb-client, langchain-chroma, llama-index-vector-stores-chroma]
      python_import: [chromadb]
      npm: [chromadb]
      image: [chromadb/chroma, ghcr.io/chroma-core/chroma]
      maven: ["dev.langchain4j:langchain4j-chroma",
              "org.springframework.ai:spring-ai-starter-vector-store-chroma",
              "org.springframework.ai:spring-ai-chroma-store"]
      go: [github.com/amikos-tech/chroma-go]
  lancedb/lancedb:
    kind: [embedded]
    detect:
      requirement: [lancedb, llama-index-vector-stores-lancedb]
      python_import: [lancedb]
      npm: ["@lancedb/lancedb", vectordb]
  pgvector/pgvector:
    kind: [Postgres extension]
    detect:
      requirement: [pgvector, langchain-postgres, llama-index-vector-stores-postgres]
      python_import: [pgvector]
      npm: [pgvector]
      image: [pgvector/pgvector, ankane/pgvector]
      maven: ["org.springframework.ai:spring-ai-starter-vector-store-pgvector",
              "org.springframework.ai:spring-ai-pgvector-store",
              "dev.langchain4j:langchain4j-pgvector", "com.pgvector:pgvector"]
      nuget: [Pgvector, Pgvector.EntityFrameworkCore, Microsoft.KernelMemory.Postgres]
      go: [github.com/pgvector/pgvector-go]
      sql_extension: [vector]
  vespa-engine/vespa:
    kind: [server]
    detect:
      requirement: [pyvespa]
      image: [vespaengine/vespa]

  # ---------------------------------------------------------------- search engines
  opensearch-project/OpenSearch:
    kind: [server]
    detect:
      requirement: [opensearch-py, llama-index-vector-stores-opensearch]
      python_import: [opensearchpy]
      npm: ["@opensearch-project/opensearch"]
      maven: ["org.opensearch.client:opensearch-java", "dev.langchain4j:langchain4j-opensearch",
              "org.springframework.ai:spring-ai-starter-vector-store-opensearch",
              "org.springframework.ai:spring-ai-opensearch-store"]
      image: [opensearchproject/opensearch]
      go: [github.com/opensearch-project/opensearch-go]
  meilisearch/meilisearch:
    kind: [server]
    detect:
      requirement: [meilisearch]
      python_import: [meilisearch]
      npm: [meilisearch]
      image: [getmeili/meilisearch]
  typesense/typesense:
    kind: [server]
    detect:
      requirement: [typesense]
      python_import: [typesense]
      npm: [typesense]
      image: [typesense/typesense]
      maven: ["org.springframework.ai:spring-ai-starter-vector-store-typesense",
              "org.springframework.ai:spring-ai-typesense-store"]
  paradedb/paradedb:
    kind: [Postgres extension]
    detect:
      image: [paradedb/paradedb]
      sql_extension: [pg_search]
  quickwit-oss/tantivy:
    kind: [library]
    detect:
      requirement: [tantivy]
      python_import: [tantivy]
      cargo: [tantivy]
  infiniflow/infinity:
    kind: [server]
    detect:
      requirement: [infinity-sdk]
      image: [infiniflow/infinity]

  # ---------------------------------------------------------------- RAG
  infiniflow/ragflow:
    kind: [application]
    detect:
      requirement: [ragflow-sdk]
      image: [infiniflow/ragflow]
  HKUDS/LightRAG:
    kind: [library]
    detect:
      requirement: [lightrag-hku]
      python_import: [lightrag]
  microsoft/graphrag:
    kind: [library]
    detect:
      requirement: [graphrag]
      python_import: [graphrag]
  run-llama/llama_index:
    kind: [framework]
    detect:
      requirement: [llama-index, llama-index-core]
      python_import: [llama_index]
      npm: [llamaindex]
  deepset-ai/haystack:
    kind: [framework]
    detect:
      requirement: [haystack-ai, farm-haystack]
      python_import: [haystack]
  onyx-dot-app/onyx:
    kind: [application]
    detect:
      image: [onyxdotapp/onyx-backend]

  # ---------------------------------------------------------------- serving
  vllm-project/vllm:
    kind: [server]
    detect:
      requirement: [vllm]
      python_import: [vllm]
      image: [vllm/vllm-openai, lmcache/vllm-openai]
      # Reached over its OpenAI-compatible API: LangChain's VLLMOpenAI, or a base URL
      # setting named for it.
      symbol: [VLLMOpenAI]
      env: [VLLM_OPENAI_API_BASE, VLLM_API_BASE, VLLM_BASE_URL]
  sgl-project/sglang:
    kind: [server]
    detect:
      requirement: [sglang]
      python_import: [sglang]
      image: [lmsysorg/sglang]
  ggml-org/llama.cpp:
    kind: [server, library]
    detect:
      requirement: [llama-cpp-python]
      python_import: [llama_cpp]
      npm: [node-llama-cpp]
      image: [ghcr.io/ggml-org/llama.cpp, ghcr.io/ggerganov/llama.cpp]
      maven: ["de.kherud:llama"]
      nuget: [LLamaSharp]
  ollama/ollama:
    kind: [server]
    detect:
      requirement: [ollama, langchain-ollama, llama-index-llms-ollama,
                    llama-index-embeddings-ollama]
      python_import: [ollama, langchain_ollama]
      npm: [ollama, ollama-ai-provider, ollama-ai-provider-v2, "@langchain/ollama"]
      go: [github.com/ollama/ollama]
      image: [ollama/ollama]
