# Open source alternatives, grouped into pools.
#
# A pool is one kind of replacement: "inference server", "vector database". A closed
# service names the pools that replace it (see services/*.yaml), so a project added
# here is offered everywhere it applies.
#
# Order in this file means nothing. `scripts/refresh.py` ranks every pool by momentum
# and writes catalog/rankings.json; the scanner reads that snapshot and never touches
# the network.
#
#   github pools       — ranked by stars gained in the last 90 days. Archived repos,
#                        repos with no push in 180 days and repos whose licence is not
#                        OSI-approved are dropped from the ranking.
#   huggingface pools  — open-weight models, discovered rather than listed: the newest
#                        original (non-derived) models from the listed publishers, with
#                        an open licence, ranked by Hugging Face's trending score.
#
# `licence` is only needed where GitHub cannot detect it (it reports NOASSERTION) —
# it must then be an SPDX id from the allowlist in lockin/catalog.py. Open-core
# projects count when the core is OSI-licensed and the closed part sits apart (an
# `ee/` directory); the declared licence is the core's. Licences that add terms to
# an OSI licence (commercial thresholds, use restrictions) do not count.

pools:

  # ---------------------------------------------------------------- LLMs

  - id: llm-serving
    name: Inference server
    source: github
    projects:
      - {repo: vllm-project/vllm, what: High-throughput production inference server, OpenAI-compatible API}
      - {repo: sgl-project/sglang, what: Fast inference server for LLMs and multimodal models, OpenAI-compatible API}
      - {repo: ggml-org/llama.cpp, what: "LLM inference in C/C++ on CPU, GPU and Apple Silicon; OpenAI-compatible llama-server"}
      - {repo: ollama/ollama, what: Run open models locally with one command, OpenAI-compatible API}
      - {repo: InternLM/lmdeploy, what: Toolkit for compressing, deploying and serving LLMs}
      - {repo: NVIDIA/TensorRT-LLM, what: Optimised LLM inference on NVIDIA GPUs, licence: Apache-2.0}
      - {repo: mudler/LocalAI, what: Self-hosted drop-in replacement for the OpenAI API, runs on consumer hardware}
      - {repo: ai-dynamo/dynamo, what: Datacenter-scale distributed inference serving framework, licence: Apache-2.0}

  - id: open-llm
    name: Open-weight LLM
    source: huggingface
    pipeline_tags: [text-generation, image-text-to-text]
    publishers: [Qwen, deepseek-ai, openai, mistralai, moonshotai, zai-org, XiaomiMiMo, MiniMaxAI,
                 nvidia, ibm-granite, google, microsoft, allenai, HuggingFaceTB, openbmb, tencent,
                 baidu, stepfun-ai, meituan-longcat, inclusionAI, ServiceNow-AI, swiss-ai, arcee-ai]

  - id: llm-gateway
