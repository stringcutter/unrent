      - {repo: maximhq/bifrost, what: High-performance LLM gateway written in Go}
      - {repo: songquanpeng/one-api, what: "Unified OpenAI-compatible API over many providers, with key management"}
      - {repo: QuantumNous/new-api, what: "LLM gateway and key management, successor fork of one-api"}
      - {repo: theagentrouter/agent-router, what: AI gateway built on Envoy Proxy}
