# Model retirements the vendors announce for their own APIs (`vendors`) and the cloud
# platforms for the models they serve (`platforms`: Azure, Bedrock, Vertex): a model id
# the code selects that has stopped working, or will on the date given. The same id can
# retire on two dates: gpt-4o on Azure is not gpt-4o on OpenAI's API. Checked weekly
# against each page by scripts/retirements.py; edit by hand only to fix a mistake.
vendors:
  openai:
    url: https://developers.openai.com/api/docs/deprecations
    # The catalog services whose model ids these are.
    services: [openai, openai-images, openai-speech-to-text, openai-text-to-speech, openai-realtime, openai-moderation, openai-embeddings, openai-computer-use]
    models:
