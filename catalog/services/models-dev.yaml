  category: LLM API
  replace_with:
  - open-llm
  - llm-serving
  source: models.dev
  doc: https://docs.zeldoc.ai
  excludes:
  - openai
  detect:
    endpoint:
    - api.zeldoc.ai
    env:
    - ZELDOC_API_KEY
- id: zenifra
  name: Zenifra
  category: LLM API
  replace_with:
  - open-llm
  - llm-serving
  source: models.dev
  doc: https://docs.zenifra.com
  excludes:
  - openai
  detect:
    endpoint:
    - ai.zenifra.com
- id: zenmux
  name: ZenMux
  category: LLM API
  replace_with:
  - open-llm
  - llm-serving
  source: models.dev
  doc: https://docs.zenmux.ai
  excludes:
  - openai
  detect:
    endpoint:
    - zenmux.ai/api/v1
    env:
    - ZENMUX_API_KEY
