# Closed speech, voice and image services.

# ---------------------------------------------------------------- speech-to-text

- id: openai-speech-to-text
  name: OpenAI speech-to-text
  category: Speech-to-text
  part_of: openai
  weak: [audio.transcriptions.create, audio.translations.create]
  replace_with: [speech-to-text]
  detect:
    symbol: ["audio.transcriptions.create", "audio.translations.create", "openai.transcription(",
             OpenAiAudioTranscriptionModel]
    endpoint: [api.openai.com/v1/audio/transcriptions, api.openai.com/v1/audio/translations]
    model: [whisper-1, gpt-4o-transcribe, gpt-4o-mini-transcribe, gpt-transcribe,
            gpt-live-transcribe]

- id: deepgram
  name: Deepgram
  category: Speech-to-text
  replace_with: [speech-to-text, text-to-speech]
  detect:
    requirement: [deepgram-sdk]
    npm: ["@deepgram/sdk", "@ai-sdk/deepgram", "@mastra/voice-deepgram"]
    python_import: [deepgram]
    symbol: [DeepgramClient, createDeepgram]
    endpoint: [api.deepgram.com, agent.deepgram.com]
    env: [DEEPGRAM_API_KEY]
    nuget: [Deepgram]

- id: assemblyai
  name: AssemblyAI
  category: Speech-to-text
  replace_with: [speech-to-text]
  detect:
    requirement: [assemblyai]
    npm: [assemblyai, "@ai-sdk/assemblyai"]
    python_import: [assemblyai]
    endpoint: [api.assemblyai.com, llm-gateway.assemblyai.com]
    env: [ASSEMBLYAI_API_KEY]
    nuget: [AssemblyAI]

- id: speechmatics
  name: Speechmatics
  category: Speech-to-text
  replace_with: [speech-to-text]
  detect:
    requirement: [speechmatics-python, speechmatics-batch, speechmatics-rt, speechmatics-tts,
                  speechmatics-voice, speechmatics-flow]
    npm: ["@speechmatics/batch-client", "@speechmatics/real-time-client", "@speechmatics/auth"]
    python_import: [speechmatics]
    env: [SPEECHMATICS_API_KEY]
    endpoint: [asr.api.speechmatics.com, rt.speechmatics.com, flow.api.speechmatics.com,
               tts.speechmatics.com]

- id: gladia
  name: Gladia
  category: Speech-to-text
  replace_with: [speech-to-text]
  detect:
    npm: ["@gladiaio/sdk", "@ai-sdk/gladia", "@mastra/voice-gladia"]
    requirement: [gladiaio-sdk]
    python_import: [gladiaio_sdk]
    symbol: [GladiaClient]
    endpoint: [api.gladia.io]
    env: [GLADIA_API_KEY]

- id: revai
  name: Rev AI
  category: Speech-to-text
  replace_with: [speech-to-text]
  detect:
    requirement: [rev-ai]
    npm: [revai-node-sdk, "@ai-sdk/revai"]
    python_import: [rev_ai]
    endpoint: [api.rev.ai]
    env: [REVAI_ACCESS_TOKEN, REV_AI_ACCESS_TOKEN, REVAI_API_KEY]

- id: google-speech
  name: Google Cloud Speech-to-Text / Text-to-Speech
  category: Speech-to-text
  replace_with: [speech-to-text, text-to-speech]
  detect:
    requirement: [google-cloud-speech, google-cloud-texttospeech]
    npm: ["@google-cloud/speech", "@google-cloud/text-to-speech", "@mastra/voice-google"]
    python_import: [google.cloud.speech, google.cloud.speech_v2, google.cloud.texttospeech]
    endpoint: [speech.googleapis.com, texttospeech.googleapis.com]

- id: aws-transcribe-polly
  name: Amazon Transcribe / Polly
  category: Speech-to-text
  replace_with: [speech-to-text, text-to-speech]
  detect:
    requirement: [amazon-transcribe, aws-sdk-transcribe-streaming, aws-sdk-polly]
    npm: ["@aws-sdk/client-transcribe", "@aws-sdk/client-transcribe-streaming",
          "@aws-sdk/client-polly"]
    python_import: [amazon_transcribe, aws_sdk_transcribe_streaming, aws_sdk_polly]
    # The client call, not the bare string: Whisper takes task="transcribe" too.
    symbol: ['client("transcribe"', "client('transcribe'", 'client("polly"', "client('polly'",
             'service_name="transcribe"', 'service_name="polly"', TranscribeClient, PollyClient,
             TranscribeStreamingClient, TranscribeStreamingAsyncClient,
             AsyncTranscribeStreamingClient]

- id: azure-speech
  name: Azure AI Speech
  category: Speech-to-text
  weak: [SPEECH_KEY, SPEECH_REGION]
  replace_with: [speech-to-text, text-to-speech]
  detect:
    requirement: [azure-cognitiveservices-speech]
    npm: [microsoft-cognitiveservices-speech-sdk, "@mastra/voice-azure"]
    python_import: [azure.cognitiveservices.speech]
    symbol: ["speechsdk.SpeechRecognizer", "speechsdk.SpeechSynthesizer",
             "SpeechConfig.fromSubscription", "SpeechConfig.FromSubscription",
             "SpeechConfig(subscription"]
    maven: ["com.microsoft.cognitiveservices.speech:client-sdk"]
    nuget: [Microsoft.CognitiveServices.Speech]
    endpoint: [stt.speech.microsoft.com, tts.speech.microsoft.com]
    env: [AZURE_SPEECH_KEY, AZURE_SPEECH_REGION, SPEECH_KEY, SPEECH_REGION]

# ---------------------------------------------------------------- text-to-speech

- id: openai-text-to-speech
  name: OpenAI text-to-speech
  category: Text-to-speech
  part_of: openai
  weak: [audio.speech.create]
  replace_with: [text-to-speech]
  detect:
    symbol: ["audio.speech.create", "openai.speech("]
    endpoint: [api.openai.com/v1/audio/speech]
    model: [tts-1, gpt-4o-mini-tts]
    npm: ["@mastra/voice-openai"]

- id: elevenlabs
  name: ElevenLabs
  category: Text-to-speech
  replace_with: [text-to-speech, speech-to-text]
  detect:
    requirement: [elevenlabs, llama-index-tools-elevenlabs]
    npm: [elevenlabs, "@elevenlabs/elevenlabs-js", "@elevenlabs/react", "@elevenlabs/client",
          "@ai-sdk/elevenlabs", "@mastra/voice-elevenlabs"]
    python_import: [elevenlabs, llama_index.tools.elevenlabs]
    symbol: [ElevenLabsClient, "ElevenLabs(", "new ElevenLabs"]
    model: [eleven_multilingual_, eleven_turbo_, eleven_flash_, eleven_v3, eleven_monolingual_,
            scribe_v1, scribe_v2]
    endpoint: [api.elevenlabs.io, api.us.elevenlabs.io, residency.elevenlabs.io]
    env: [ELEVENLABS_API_KEY, ELEVEN_API_KEY]
    maven: ["org.springframework.ai:spring-ai-elevenlabs",
            "org.springframework.ai:spring-ai-starter-model-elevenlabs"]
    nuget: [ElevenLabs-DotNet]
    swift: [github.com/elevenlabs/elevenlabs-swift-sdk]

- id: cartesia
  name: Cartesia
  category: Text-to-speech
  weak: [sonic-2, sonic-3]
  replace_with: [text-to-speech]
  detect:
    requirement: [cartesia]
    npm: ["@cartesia/cartesia-js", "@ai-sdk/cartesia"]
    python_import: [cartesia]
    model: [sonic-2, sonic-3, sonic-latest, sonic-english, sonic-multilingual, sonic-turbo]
    endpoint: [api.cartesia.ai]
    env: [CARTESIA_API_KEY]

- id: playht
  name: PlayHT
  category: Text-to-speech
  replace_with: [text-to-speech]
  detect:
    requirement: [pyht]
    npm: [playht]
    python_import: [pyht]
    endpoint: [api.play.ht]
    env: [PLAY_HT_API_KEY, PLAYHT_API_KEY, PLAY_HT_USER_ID, PLAYHT_USER_ID]

- id: hume
  name: Hume AI
  category: Text-to-speech
  replace_with: [text-to-speech, voice-agent]
  detect:
    requirement: [hume]
    npm: [hume, "@humeai/voice-react", "@ai-sdk/hume"]
    python_import: [hume]
    endpoint: [api.hume.ai]
    env: [HUME_API_KEY, HUME_SECRET_KEY]

# ---------------------------------------------------------------- voice agents

- id: openai-realtime
  name: OpenAI Realtime API
  category: Voice agent
  part_of: openai
  weak: [RealtimeAgent, beta.realtime]
  replace_with: [voice-agent, speech-to-text, text-to-speech]
  detect:
    symbol: ["beta.realtime", RealtimeAgent, OpenAIRealtimeWebRTC]
    model: [gpt-4o-realtime-, gpt-4o-mini-realtime-, gpt-realtime, gpt-live-]
    endpoint: [api.openai.com/v1/realtime]
    npm: ["@openai/agents-realtime", "@mastra/voice-openai-realtime"]
    pub: [openai_realtime_dart]

- id: vapi
  name: Vapi
  category: Voice agent
  replace_with: [voice-agent]
  detect:
    requirement: [vapi-server-sdk]
    npm: ["@vapi-ai/web", "@vapi-ai/server-sdk", "@vapi-ai/react-native"]
    go: [github.com/VapiAI/server-sdk-go]
    python_import: [vapi]
    endpoint: [api.vapi.ai, api.eu.vapi.ai]
    env: [VAPI_API_KEY, VAPI_PRIVATE_KEY, VAPI_PUBLIC_KEY, NEXT_PUBLIC_VAPI_PUBLIC_KEY]

- id: retell
  name: Retell AI
  category: Voice agent
  replace_with: [voice-agent]
  detect:
    requirement: [retell-sdk]
    npm: [retell-sdk, retell-client-js-sdk]
    python_import: [retell]
    endpoint: [api.retellai.com]
    env: [RETELL_API_KEY]

- id: bland
  name: Bland AI
  category: Voice agent
  replace_with: [voice-agent]
  detect:
    npm: ["@blandsdk/client", bland-tts]
    endpoint: [api.bland.ai]
    env: [BLAND_API_KEY]

# ---------------------------------------------------------------- images

- id: openai-images
  name: OpenAI image generation
  category: Image generation
  # Together and others mirror images.generate; GenerateImageAsync is generic too.
  weak: ["images.generate", GenerateImageAsync]
  part_of: openai
  replace_with: [image-generation]
  detect:
    symbol: ["openai.image(", OpenAITextToImageService, "images.generate", GenerateImageAsync]
    model: [dall-e-2, dall-e-3, gpt-image-, sora-2, chatgpt-image-]

- id: google-imagen
  name: Google Imagen / Veo
  category: Image generation
  part_of: [google-gemini, google-vertex]
  replace_with: [image-generation]
  detect:
    symbol: [ImageGenerationModel]
    model: [imagen-, veo-2, veo-3, gemini-2.5-flash-image, gemini-3-pro-image,
            gemini-2.0-flash-exp-image-generation, gemini-2.0-flash-preview-image-generation]
    maven: ["org.springframework.ai:spring-ai-google-genai-image"]

- id: stability-api
  name: Stability AI API
  category: Image generation
  replace_with: [image-generation]
  detect:
    requirement: [stability-sdk]
    python_import: [stability_sdk]
    endpoint: [api.stability.ai, grpc.stability.ai]
    env: [STABILITY_API_KEY, STABILITY_KEY, STABILITY_HOST]
    maven: ["org.springframework.ai:spring-ai-stability-ai",
            "org.springframework.ai:spring-ai-starter-model-stability-ai"]

- id: fal
  name: fal.ai
  category: Image generation
  replace_with: [image-generation, llm-serving]
  detect:
    requirement: [fal-client]
    npm: ["@fal-ai/client", "@fal-ai/serverless-client", "@fal-ai/server-proxy", "@ai-sdk/fal"]
    python_import: [fal_client]
    symbol: [createFal]
    model: ["fal-ai/"]
    endpoint: [fal.run, queue.fal.run, fal.media, rest.fal.ai]
    env: [FAL_KEY, FAL_API_KEY, FAL_KEY_ID, FAL_KEY_SECRET]

- id: bfl-api
  name: Black Forest Labs API
