- id: fastcrw-cloud
  name: fastCRW (hosted CRW)
  category: Web scraping
  # CRW is open source (AGPL) and self-hostable; its `crw` SDK talks to either. The key
  # is what the managed cloud needs, but CRW is a short name others use too.
  weak: [[CRW_API_KEY, AGENT_CRW_API_KEY]]
  replace_with: [web-scraping, web-search]
  self_host: fastcrw/crw
  detect:
    endpoint: [fastcrw.com/api, api.fastcrw.com]
    env: [CRW_API_KEY, AGENT_CRW_API_KEY]


