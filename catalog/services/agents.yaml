# Closed agent infrastructure: search, scraping, browsers, sandboxes, memory,
# observability.

# ---------------------------------------------------------------- web search

- id: tavily
  name: Tavily
  category: Web search
  replace_with: [web-search, web-scraping]
  detect:
    requirement: [tavily-python, langchain-tavily, llama-index-tools-tavily-research]
    npm: ["@tavily/core", "@langchain/tavily", "@mastra/tavily"]
    python_import: [tavily, langchain_tavily, llama_index.tools.tavily_research]
    symbol: [TavilyClient, TavilySearch, TavilySearchResults, AsyncTavilyClient]
    endpoint: [api.tavily.com]
    env: [TAVILY_API_KEY]
    maven: ["dev.langchain4j:langchain4j-web-search-engine-tavily"]

- id: exa
  name: Exa
  category: Web search
  replace_with: [web-search, web-scraping]
  detect:
    # Exa was called Metaphor until 2024.
    requirement: [exa-py, langchain-exa, metaphor-python, llama-index-tools-exa]
    npm: [exa-js, "@langchain/exa", metaphor-node]
    python_import: [exa_py, langchain_exa, metaphor_python, llama_hub.tools.metaphor,
                    llama_index.tools.metaphor, llama_index.tools.exa]
    symbol: [MetaphorToolSpec]
    endpoint: [api.exa.ai, api.metaphor.systems]
    env: [EXA_API_KEY]

- id: serper
  name: Serper
  category: Web search
  replace_with: [web-search]
  detect:
    npm: ["@langchain/community/tools/serper"]
    symbol: [GoogleSerperAPIWrapper, SerperDevTool]
    endpoint: [google.serper.dev]
    env: [SERPER_API_KEY]

- id: serpapi
  name: SerpApi
  category: Web search
  replace_with: [web-search]
  detect:
    requirement: [google-search-results, serpapi]
    npm: [serpapi, "@langchain/community/tools/serpapi",
          "@langchain/community/document_loaders/web/serpapi"]
    python_import: [serpapi]
    symbol: [SerpAPIWrapper]
    endpoint: [serpapi.com]
    env: [SERPAPI_API_KEY, SERPAPI_KEY, SERP_API_KEY]

- id: brave-search
  name: Brave Search API
  category: Web search
  replace_with: [web-search]
  detect:
    symbol: [BraveSearch]
    endpoint: [api.search.brave.com]
    env: [BRAVE_API_KEY, BRAVE_SEARCH_API_KEY]
    requirement: [llama-index-tools-brave-search]
    python_import: [llama_index.tools.brave_search]

- id: bing-search
  name: Bing / Grounding with Bing Search
  category: Web search
  replace_with: [web-search]
  detect:
    symbol: [BingSearchAPIWrapper, BingGroundingTool]
    endpoint: [api.bing.microsoft.com]
    env: [BING_SUBSCRIPTION_KEY, BING_SEARCH_URL, BING_API_KEY]
    requirement: [llama-index-tools-bing-search]
    python_import: [llama_index.tools.bing_search]

- id: firecrawl-cloud
  name: Firecrawl (hosted)
  category: Web scraping
  replace_with: [web-scraping]
  self_host: firecrawl/firecrawl
  detect:
    requirement: [firecrawl-py, firecrawl, langchain-firecrawl]
    npm: ["@mendable/firecrawl-js", firecrawl]
    python_import: [firecrawl, langchain_firecrawl]
    symbol: [FirecrawlApp, FireCrawlLoader]
    endpoint: [api.firecrawl.dev]
    env: [FIRECRAWL_API_KEY]

- id: apify
  name: Apify
  category: Web scraping
  replace_with: [web-scraping, browser-automation]
  detect:
    requirement: [apify-client, langchain-apify]
    npm: [apify-client]
    python_import: [apify_client, langchain_apify]
    endpoint: [api.apify.com]
    env: [APIFY_API_TOKEN, APIFY_TOKEN]

- id: browserbase
  name: Browserbase
  category: Browser automation
  replace_with: [browser-automation]
  detect:
    requirement: [browserbase]
    npm: ["@browserbasehq/sdk"]
    python_import: [browserbase]
    endpoint: [connect.browserbase.com, api.browserbase.com]
    env: [BROWSERBASE_API_KEY, BROWSERBASE_PROJECT_ID]

- id: hyperbrowser
  name: Hyperbrowser
  category: Browser automation
  replace_with: [browser-automation]
  detect:
    requirement: [hyperbrowser, langchain-hyperbrowser]
    npm: ["@hyperbrowser/sdk"]
    python_import: [hyperbrowser, langchain_hyperbrowser]
    env: [HYPERBROWSER_API_KEY]
    endpoint: [api.hyperbrowser.ai]

- id: openai-computer-use
  name: OpenAI computer use / Operator
  category: Browser automation
  part_of: openai
  replace_with: [browser-automation]
  detect:
    symbol: ['"computer_use_preview"', "'computer_use_preview'"]
    model: [computer-use-preview]

# ---------------------------------------------------------------- sandboxes

- id: e2b
  name: E2B (hosted)
  category: Code sandbox
  replace_with: [code-sandbox]
  self_host: e2b-dev/runtime
  detect:
    requirement: [e2b, e2b-code-interpreter, e2b-desktop, langchain-e2b]
    npm: [e2b, "@e2b/code-interpreter", "@e2b/desktop", "@mastra/e2b"]
    python_import: [e2b, e2b_code_interpreter, e2b_desktop, langchain_e2b]
    endpoint: [e2b.app, api.e2b.dev]
    env: [E2B_API_KEY]

- id: modal
  name: Modal
  category: Code sandbox
  replace_with: [code-sandbox, llm-serving]
  detect:
    requirement: [modal, langchain-modal]
    python_import: [modal, langchain_modal]
    symbol: ["modal.App", "modal.Image", "modal.Sandbox"]
    endpoint: [modal.run]
    env: [MODAL_TOKEN_ID, MODAL_TOKEN_SECRET]
    npm: ["@langchain/modal"]

- id: vercel-sandbox
  name: Vercel Sandbox
  category: Code sandbox
  replace_with: [code-sandbox]
  detect:
    npm: ["@vercel/sandbox", "@ai-sdk/sandbox-vercel"]

