    # GETXAPI_KEY in the vendor's MCP server, GETXAPI_API_KEY in gpt-researcher's retriever.
    env: [GETXAPI_KEY, GETXAPI_API_KEY]

- id: xquik
  name: Xquik (X/Twitter search)
  category: Web search
  replace_with: [web-search, web-scraping]
  detect:
