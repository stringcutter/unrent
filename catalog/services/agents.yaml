# ---------------------------------------------------------------- observability

- id: langsmith
  name: LangSmith
  category: LLM observability
  replace_with: [llm-observability, llm-evals]
  detect:
    requirement: [langsmith]
    npm: [langsmith, "@mastra/langsmith"]
    python_import: [langsmith]
    symbol: ["@traceable", LangChainTracer]
    endpoint: [api.smith.langchain.com]
    env: [LANGCHAIN_API_KEY, LANGCHAIN_TRACING_V2, LANGSMITH_API_KEY, LANGSMITH_TRACING]

- id: braintrust
  name: Braintrust
  category: LLM observability
  replace_with: [llm-observability, llm-evals]
  detect:
    requirement: [braintrust]
    npm: [braintrust, "@mastra/braintrust"]
    python_import: [braintrust]
    endpoint: [api.braintrust.dev]
    env: [BRAINTRUST_API_KEY]

- id: wandb-weave
  name: Weights & Biases Weave
  category: LLM observability
  # W&B's key is for experiment tracking too.
  weak: [WANDB_API_KEY]
  replace_with: [llm-observability]
  detect:
    requirement: [weave]
    npm: [weave]
    python_import: [weave]
    symbol: ["weave.init(", "@weave.op"]
    env: [WANDB_API_KEY]

- id: helicone-cloud
  name: Helicone Cloud
  category: LLM observability
  replace_with: [llm-observability, llm-gateway]
  self_host: Helicone/helicone
  detect:
    # The gateway and the per-provider proxy hosts (docs.helicone.ai, integration-method).
    endpoint: [oai.helicone.ai, anthropic.helicone.ai, gateway.helicone.ai, ai-gateway.helicone.ai,
               together.helicone.ai, openrouter.helicone.ai, fireworks.helicone.ai,
               groq.helicone.ai, deepinfra.helicone.ai, perplexity.helicone.ai,
               mistral.helicone.ai, deepseek.helicone.ai, x.helicone.ai, bedrock.helicone.ai,
               nebius.helicone.ai, novita.helicone.ai, qstash.helicone.ai,
               firecrawl.helicone.ai]
    env: [HELICONE_API_KEY]
    requirement: [llama-index-llms-helicone]
    python_import: [llama_index.llms.helicone]

- id: datadog-llm-observability
  name: Datadog LLM Observability
  category: LLM observability
  replace_with: [llm-observability]
  detect:
