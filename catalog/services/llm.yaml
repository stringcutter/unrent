    env: [GITEE_AI_API_KEY, GITEEAI_API_KEY]


- id: ppio
  name: PPIO (派欧云) LLM API
  category: LLM API
  excludes: [openai]
  replace_with: [open-llm, llm-serving]
  detect:
    # Not the `ppio` npm package: that is PPIO's older P2P storage SDK.
    endpoint: [api.ppinfra.com, api.ppio.com]
    env: [PPIO_API_KEY]


- id: apipie
  name: APIpie
  category: LLM gateway
  excludes: [openai]
  replace_with: [llm-gateway, llm-serving]
  detect:
    # Not the `apipie` packages on PyPI and npm: both are unrelated projects.
    endpoint: [apipie.ai/v1]
    env: [APIPIE_API_KEY, APIPIE_LLM_API_KEY]


- id: cometapi
  name: CometAPI
  category: LLM gateway
  excludes: [openai]
  replace_with: [llm-gateway, llm-serving]
  detect:
    requirement: [cometapi, llama-index-llms-cometapi]
    npm: [cometapi]
    python_import: [cometapi, llama_index.llms.cometapi]
    symbol: ["CometAPI(", "AsyncCometAPI("]
    model: [cometapi/]
    endpoint: [api.cometapi.com]
    # Not COMET_API_KEY: that is Comet ML's experiment tracker.
    env: [COMETAPI_KEY, COMETAPI_API_KEY, COMETAPI_LLM_API_KEY]


- id: privatemode
  name: Privatemode AI (Edgeless Systems)
  category: LLM API
  excludes: [openai]
  replace_with: [open-llm, llm-serving]
  detect:
    # Apps talk to a local encryption proxy, which forwards to the hosted service; the
    # proxy image and its localhost URL are how a codebase shows it.
    image: [ghcr.io/edgelesssys/privatemode/privatemode-proxy]
    endpoint: [api.privatemode.ai]
    env: [PRIVATEMODE_API_KEY, PRIVATEMODE_LLM_BASE_PATH, PRIVATEMODE_LLM_MODEL_PREF]


