# Closed LLM APIs and gateways.
#
# Signature kinds (see unrent/detect.py for exactly how each is matched):
#   requirement         Python package: requirements*.txt, pyproject, setup.py/cfg, Pipfile, conda, pip install
#   go, cargo, maven, nuget, gem, composer   package in that ecosystem's manifest
#   npm                 package in package.json, a JS/TS import or require, or npm/pnpm/yarn/bun add
#   python_import       module imported in .py or .ipynb (prefix match: `a.b` matches `a.b.c`)
#   symbol              identifier or call in source code, word-bounded and case-sensitive
#   model               model id prefix inside source or config ("gpt-4" matches "gpt-4o-mini")
#   endpoint            API host (optionally with a path) anywhere in source or config
#   env                 environment variable read in code or set in .env files
#   terraform_resource  resource or data type in .tf files
#
# `excludes` names a more general service whose shared evidence this one claims when
# it also has evidence of its own (Azure OpenAI ships inside the `openai` package).

- id: openai
  name: OpenAI API
  category: LLM API
  local_compatible: true
  weak: [agents]
  replace_with: [open-llm, llm-serving]
  open_models: [gpt-oss]
  detect:
    pub: [dart_openai, openai_dart, langchain_openai]
    swift: [github.com/macpaw/openai, github.com/jamesrochabrun/swiftopenai]
    go: [github.com/openai/openai-go, github.com/sashabaranov/go-openai]
    cargo: [async-openai, openai-api-rs]
    maven: ["com.openai:openai-java", "dev.langchain4j:langchain4j-open-ai",
            "org.springframework.ai:spring-ai-openai",
            "org.springframework.ai:spring-ai-starter-model-openai",
            "org.springframework.ai:spring-ai-openai-spring-boot-starter",
            "com.theokanning.openai-gpt3-java:service", "com.aallam.openai:openai-client"]
    nuget: [OpenAI, Microsoft.SemanticKernel.Connectors.OpenAI, Microsoft.Extensions.AI.OpenAI,
            Betalgo.OpenAI, Betalgo.Ranul.OpenAI, OpenAI-DotNet, Microsoft.Agents.AI.OpenAI]
    gem: [ruby-openai, openai]
    composer: [openai-php/client, openai-php/laravel]
    requirement: [openai, langchain-openai, llama-index-llms-openai, openai-agents, openai-chatkit,
                  agent-framework-openai]
    npm: [openai, "@ai-sdk/openai", "@langchain/openai", "@openai/agents", "@openai/agents-openai",
          "@openai/codex-sdk", "@openai/chatkit", "@openai/chatkit-react"]
    python_import: [openai, langchain_openai, llama_index.llms.openai, agents,
                    agent_framework.openai, agent_framework_openai]
    symbol: ["openai.OpenAI", "openai.AsyncOpenAI", "OpenAI(", "AsyncOpenAI(", "ChatOpenAI(",
             "createOpenAI("]
    model: ["gpt-3.5", "gpt-4", "gpt-5", "chatgpt-4o", "o1-mini", "o1-preview", "o3-mini", "o3-pro",
            "o4-mini", "openai:gpt-", "openai/gpt-", "openai/o3", "openai/o4", gpt-6, o1-pro,
            o3-deep-research, o1-2024-, o3-2025-, codex-mini, gpt-audio, "openai-chat:",
            "openai-responses:", chatgpt/]
    endpoint: [api.openai.com]
    env: [OPENAI_API_KEY, OPENAI_ORG_ID, OPENAI_ORGANIZATION, OPENAI_PROJECT_ID, OPENAI_ADMIN_KEY,
          OPENAI_WEBHOOK_SECRET]

