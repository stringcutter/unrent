            "org.springframework.ai:spring-ai-starter-model-bedrock-converse"]
    nuget: [AWSSDK.BedrockRuntime, AWSSDK.BedrockAgentRuntime,
            Microsoft.SemanticKernel.Connectors.Amazon]
    gem: [aws-sdk-bedrockruntime]
    requirement: [langchain-aws, llama-index-llms-bedrock, llama-index-llms-bedrock-converse,
                  anthropic-bedrock, agent-framework-bedrock]
    npm: ["@aws-sdk/client-bedrock-runtime", "@aws-sdk/client-bedrock",
          "@aws-sdk/client-bedrock-agent-runtime", "@ai-sdk/amazon-bedrock", "@langchain/aws",
          "@anthropic-ai/bedrock-sdk"]
    python_import: [langchain_aws, llama_index.llms.bedrock, llama_index.llms.bedrock_converse,
                    anthropic.lib.bedrock, agent_framework.amazon, agent_framework_bedrock]
    symbol: ['"bedrock-runtime"', "'bedrock-runtime'", '"bedrock-agent-runtime"',
             "'bedrock-agent-runtime'", BedrockRuntimeClient, ChatBedrock, ChatBedrockConverse,
             AnthropicBedrock, createAmazonBedrock, ApplyGuardrailCommand]
