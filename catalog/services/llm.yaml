    go: [github.com/aws/aws-sdk-go-v2/service/bedrockruntime, github.com/aws/aws-sdk-go-v2/service/bedrockagentruntime]
    cargo: [aws-sdk-bedrockruntime, aws-sdk-bedrockagentruntime]
    maven: ["software.amazon.awssdk:bedrockruntime", "software.amazon.awssdk:bedrockagentruntime",
            "dev.langchain4j:langchain4j-bedrock", "org.springframework.ai:spring-ai-bedrock-converse"]
    nuget: [AWSSDK.BedrockRuntime, AWSSDK.BedrockAgentRuntime]
    gem: [aws-sdk-bedrockruntime]
    requirement: [langchain-aws, llama-index-llms-bedrock, llama-index-llms-bedrock-converse, anthropic-bedrock]
    npm: ["@aws-sdk/client-bedrock-runtime", "@aws-sdk/client-bedrock", "@aws-sdk/client-bedrock-agent-runtime",
          "@ai-sdk/amazon-bedrock", "@langchain/aws"]
    python_import: [langchain_aws, llama_index.llms.bedrock, llama_index.llms.bedrock_converse]
    symbol: ['"bedrock-runtime"', "'bedrock-runtime'", '"bedrock-agent-runtime"', "'bedrock-agent-runtime'",
             BedrockRuntimeClient, ChatBedrock, ChatBedrockConverse, AnthropicBedrock, createAmazonBedrock]
    model: ["anthropic.claude-", "us.anthropic.claude-", "eu.anthropic.claude-", "amazon.titan-", "amazon.nova-",
            "us.amazon.nova-", "meta.llama3", "cohere.command", "mistral.mistral-", "bedrock/", "bedrock:"]
    endpoint: [bedrock-runtime., bedrock-agent-runtime.]
    env: [AWS_BEDROCK_MODEL_ID, BEDROCK_MODEL_ID, BEDROCK_REGION]
    terraform_resource: [aws_bedrock_model_invocation_logging_configuration, aws_bedrockagent_agent,
                         aws_bedrock_guardrail, aws_bedrock_provisioned_model_throughput]

