- id: azure-ai-search
  name: Azure AI Search
  category: Vector database
  replace_with: [search-engine, vector-db]
  detect:
    requirement: [azure-search-documents, llama-index-vector-stores-azureaisearch,
                  llama-index-vector-stores-cogsearch, agent-framework-azure-ai-search]
    npm: ["@azure/search-documents", "@mastra/azure-ai-search"]
    python_import: [azure.search.documents, llama_index.vector_stores.azureaisearch,
                    llama_index.vector_stores.cogsearch, agent_framework_azure_ai_search]
    symbol: [SearchIndexClient, SemanticConfiguration, AzureSearch, AzureAISearchVectorStore]
    endpoint: [search.windows.net]
    env: [AZURE_SEARCH_ENDPOINT, AZURE_SEARCH_KEY, AZURE_SEARCH_INDEX,
          AZURE_SEARCH_SERVICE_ENDPOINT, AZURE_AI_SEARCH_ENDPOINT, AZURE_AI_SEARCH_API_KEY]
    terraform_resource: [azurerm_search_service]
    nuget: [Microsoft.SemanticKernel.Connectors.AzureAISearch,
            CommunityToolkit.VectorData.AzureAISearch, Azure.Search.Documents]
    maven: ["org.springframework.ai:spring-ai-azure-store",
            "org.springframework.ai:spring-ai-starter-vector-store-azure",
            "dev.langchain4j:langchain4j-azure-ai-search"]

