# Closed embedding, reranking, vector search and document parsing services.

- id: openai-embeddings
  name: OpenAI Embeddings
  category: Embeddings
  part_of: openai
  replace_with: [embedding-model, embedding-serving]
  detect:
    requirement: [llama-index-embeddings-openai]
    python_import: [llama_index.embeddings.openai]
    # `embeddings.create` is left out: every OpenAI-compatible client, local ones included, has it.
    # LlamaIndex's embed_model="default" resolves to OpenAI embeddings.
    symbol: [OpenAIEmbeddings, OpenAIEmbedding, "openai.embedding(", "openai.textEmbeddingModel(",
             'embed_model="default"', "embed_model='default'"]
    model: [text-embedding-3-, text-embedding-ada-]

- id: google-embeddings
  name: Google Gemini / Vertex Embeddings
  category: Embeddings
  part_of: [google-gemini, google-vertex]
  replace_with: [embedding-model, embedding-serving]
  detect:
    requirement: [llama-index-embeddings-gemini, llama-index-embeddings-google-genai,
                  llama-index-embeddings-vertex, llama-index-embeddings-vertex-endpoint]
    symbol: [GoogleGenerativeAIEmbeddings, VertexAIEmbeddings]
    model: [text-embedding-004, text-embedding-005, gemini-embedding-, textembedding-gecko,
            text-multilingual-embedding-, multimodalembedding]
    maven: ["org.springframework.ai:spring-ai-vertex-ai-embedding",
            "org.springframework.ai:spring-ai-starter-model-vertex-ai-embedding",
            "org.springframework.ai:spring-ai-google-genai-embedding",
            "org.springframework.ai:spring-ai-starter-model-google-genai-embedding"]
    python_import: [llama_index.embeddings.gemini, llama_index.embeddings.google_genai,
                    llama_index.embeddings.vertex]

- id: aws-bedrock-embeddings
  name: Amazon Titan / Bedrock Embeddings
  category: Embeddings
  part_of: aws-bedrock
  replace_with: [embedding-model, embedding-serving]
  detect:
    symbol: [BedrockEmbeddings]
    model: [amazon.titan-embed-, cohere.embed-, global.cohere.embed-, us.cohere.embed-,
            twelvelabs.marengo-embed-]
    requirement: [llama-index-embeddings-bedrock]
    python_import: [llama_index.embeddings.bedrock]

- id: voyage
  name: Voyage AI
  category: Embeddings
  replace_with: [embedding-model, embedding-serving, reranker]
  detect:
    requirement: [voyageai, langchain-voyageai, llama-index-embeddings-voyageai,
                  llama-index-postprocessor-voyageai-rerank]
    npm: [voyageai, voyage-ai-provider, "@ai-sdk/voyage", "@mastra/voyageai"]
    python_import: [voyageai, langchain_voyageai, llama_index.embeddings.voyageai,
                    llama_index.postprocessor.voyageai_rerank]
    symbol: [VoyageAIEmbeddings, VoyageEmbedding, "voyageai.Client"]
    model: [voyage-3, voyage-4, voyage-code-, voyage-large-, voyage-multilingual-, voyage-law-,
            voyage-finance-, voyage-context-, voyage-multimodal-, voyage-2, voyage-lite-,
            rerank-2.5, rerank-2-lite]
    endpoint: [api.voyageai.com]
    env: [VOYAGE_API_KEY]
    maven: ["dev.langchain4j:langchain4j-voyage-ai"]
    gem: [voyageai]

- id: jina-api
  name: Jina AI API
  category: Embeddings
  replace_with: [embedding-model, reranker, web-scraping]
  detect:
    requirement: [llama-index-embeddings-jinaai, llama-index-postprocessor-jinaai-rerank]
    symbol: [JinaEmbeddings, JinaRerank]
    endpoint: [api.jina.ai, r.jina.ai, s.jina.ai]
    env: [JINA_API_KEY, JINAAI_API_KEY]
    maven: ["dev.langchain4j:langchain4j-jina"]
    python_import: [llama_index.embeddings.jinaai, llama_index.postprocessor.jinaai_rerank]

- id: mistral-embeddings
  name: Mistral Embeddings and OCR
  category: Embeddings
  part_of: mistral
  replace_with: [embedding-model, ocr]
  detect:
    symbol: [MistralAIEmbeddings]
    model: [mistral-embed, codestral-embed, mistral-ocr-]
    requirement: [llama-index-embeddings-mistralai]
    python_import: [llama_index.embeddings.mistralai]

# ---------------------------------------------------------------- vector search

- id: pinecone
  name: Pinecone
  category: Vector database
  weak: [pinecone.io]
  replace_with: [vector-db]
  detect:
    go: [github.com/pinecone-io/go-pinecone]
    maven: ["io.pinecone:pinecone-client", "dev.langchain4j:langchain4j-pinecone",
            "org.springframework.ai:spring-ai-pinecone-store",
            "org.springframework.ai:spring-ai-starter-vector-store-pinecone"]
    nuget: [Pinecone.Client, Microsoft.SemanticKernel.Connectors.Pinecone]
    requirement: [pinecone, pinecone-client, langchain-pinecone, llama-index-vector-stores-pinecone,
                  llama-index-postprocessor-pinecone-native-rerank]
    npm: ["@pinecone-database/pinecone", "@langchain/pinecone", "@mastra/pinecone"]
    python_import: [pinecone, langchain_pinecone, llama_index.vector_stores.pinecone,
                    llama_index.postprocessor.pinecone_native_rerank]
    symbol: ["pinecone.Pinecone", "Pinecone(", PineconeVectorStore, PineconeStore, PineconeGRPC]
    endpoint: [pinecone.io]
    env: [PINECONE_API_KEY, PINECONE_ENVIRONMENT, PINECONE_INDEX, PINECONE_INDEX_NAME]
    cargo: [pinecone-sdk]

- id: upstash-vector
  name: Upstash Vector
