- id: mongodb-atlas-vector-search
  name: MongoDB Atlas Vector Search
  category: Vector database
  # Two kinds of weak evidence, and it takes one of each: vector search (DocumentDB and
  # self-managed MongoDB speak $vectorSearch too) and Atlas hosting (an Atlas cluster
  # is not Atlas Vector Search). Several Atlas hosting signals prove only a database.
  weak:
    - [$vectorSearch, SearchIndexModel]
    - ["mongodb+srv://", mongodb.net, MONGODB_ATLAS_URI, ATLAS_URI, ATLAS_CONNECTION_STRING,
       MONGODB_ATLAS_CLUSTER_URI]
  replace_with: [vector-db]
  detect:
    requirement: [langchain-mongodb, llama-index-vector-stores-mongodb]
    npm: ["@langchain/mongodb"]
    python_import: [langchain_mongodb, llama_index.vector_stores.mongodb]
    symbol: ["$vectorSearch", MongoDBAtlasVectorSearch, "mongodb+srv://", SearchIndexModel]
    endpoint: [mongodb.net]
    env: [MONGODB_ATLAS_URI, MONGODB_ATLAS_CLUSTER_URI, ATLAS_URI, ATLAS_CONNECTION_STRING]
    maven: ["org.springframework.ai:spring-ai-mongodb-atlas-store",
            "org.springframework.ai:spring-ai-starter-vector-store-mongodb-atlas",
            "dev.langchain4j:langchain4j-mongodb-atlas"]

- id: vertex-vector-search
  name: Vertex AI Vector Search
  category: Vector database
  replace_with: [vector-db]
  detect:
    symbol: [MatchingEngineIndex, MatchingEngineIndexEndpoint, VectorSearchVectorStore]
    terraform_resource: [google_vertex_ai_index, google_vertex_ai_index_endpoint_deployed_index]
    requirement: [llama-index-vector-stores-vertexaivectorsearch]
    python_import: [llama_index.vector_stores.vertexaivectorsearch]

