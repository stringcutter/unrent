    symbol: [AmazonKnowledgeBasesRetriever, AmazonKendraRetriever, '"kendra"', "'kendra'",
             "retrieve_and_generate", RetrieveCommand, RetrieveAndGenerateCommand,
             retrieveAndGenerate, knowledgeBaseId]
