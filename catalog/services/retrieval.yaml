- id: openai-file-search
  name: OpenAI vector stores / file search
  category: RAG platform
  part_of: openai
  replace_with: [rag-application, rag-framework, vector-db]
  detect:
    # Not the bare "file_search" string: agent frameworks name their own tools that.
    symbol: ["vector_stores.create", "vectorStores.create", "vector_stores.files",
             "vectorStores.files"]

