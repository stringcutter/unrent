# punkt-lockin catalog — the platform layer under a forked AI template.
#
# The enterprise RAG stack (Azure AI Search, Pinecone) is not what most AI apps are
# built on. Most are forked from a template, and the template brings a platform with
# it. `vercel/ai-chatbot` — the most-forked AI starter there is — scored zero against
# this catalog until these entries existed, while binding the app to a gateway, an
# object store, and a function runtime.
#
# Nobody chose these. That is the point: an agent or a template did, and the person
# who owns the result has never been told what it costs to leave.

- id: vercel.ai-gateway
  name: Vercel AI Gateway
  category: llm-gateway
  lockin: friction
  assessment:
    interface: 1
    data: 0
    behaviour: 0
  binding: [api, economics]
  why: >
    A hosted routing layer between the app and the model providers. Worth
    understanding precisely, because it is sold as the opposite of lock-in: you do
    gain provider portability, and you pay for it with a dependency on the router.
    The model provider becomes a config string, which also means a scanner sees the
    gateway and not what is behind it — you cannot tell from the code whose model is
    answering, or from which jurisdiction.
  detect:
    npm: ["@ai-sdk/gateway"]
    env: [AI_GATEWAY_API_KEY, AI_GATEWAY_BASE_URL]
    python_symbol: ["gateway.ai.vercel", "ai-gateway"]
  alternatives:
    - component: litellm
      compat: >
        Same idea, self-hosted: one OpenAI-shaped API in front of many providers.
        The app's provider config is rewritten once; call sites are untouched.
      effort: low
      loses: >
        A managed service with no servers of your own, plus Vercel's usage
        dashboards and spend controls. You now run and monitor the proxy.
    - name: Direct provider SDKs
      kind: no gateway at all
      compat: >
        Call the provider directly. The simplest thing that works when there is one
        provider and no plan for a second.
      effort: low
      loses: >
        Single-line provider switching and one bill. Worth it only if you were never
        going to switch — and most projects that add a gateway never do.
  verified: 2026-09-25

- id: vercel.blob
  name: Vercel Blob
  category: object-storage
  lockin: friction
  assessment:
    interface: 1
    data: 1
    behaviour: 0
  binding: [api, data, ops]
  why: >
    Proprietary object storage API, not S3-compatible. Every call site is written
    against their SDK, and the objects have to be copied out rather than repointed.
  detect:
    npm: ["@vercel/blob"]
    env: [BLOB_READ_WRITE_TOKEN]
  alternatives:
    - name: MinIO
      url: https://github.com/minio/minio
      kind: self-hosted object storage
      compat: >
        S3-compatible, so the rewrite is to a widely-supported API rather than to
        another proprietary one. That is the real gain: the next move after this is
        free.
      effort: medium
      loses: >
        A managed store with a CDN in front of it. You now run storage, back it up,
        and put your own CDN there if you need one. MinIO's licence terms have
        changed before — check them for your use rather than trusting this line.
    - name: Any S3-compatible provider
      kind: hosted object storage
      compat: "The same S3 API, so moving again later costs almost nothing."
      effort: low
      loses: >
        Nothing structural — but it is a lateral move, not an escape. You are still
        renting storage, just from someone whose API has more than one implementation.
  verified: 2026-09-25

- id: vercel.platform
  name: Vercel platform primitives
  category: platform
  lockin: friction
  assessment:
    interface: 1
    data: 0
    behaviour: 0
  binding: [ops, economics]
  why: >
    Functions, analytics and telemetry wired to one host. None of it holds your data,
    but each call site assumes the platform's runtime and its request lifecycle.
  detect:
    npm: ["@vercel/functions", "@vercel/analytics", "@vercel/otel", "@vercel/speed-insights"]
  alternatives:
    - name: A container and OpenTelemetry
      url: https://opentelemetry.io
      kind: self-hosted runtime plus open telemetry
      compat: >
        Handlers become ordinary HTTP handlers; @vercel/otel becomes plain OTel, which
        is a standard rather than a vendor. Mechanical, but it touches every route.
      effort: medium
      loses: >
        Deploy-on-push, preview environments, edge placement and zero-config scaling.
        These are real conveniences and this catalog will not pretend otherwise — for
        a small team with no platform engineer, staying may well be correct.
  verified: 2026-09-25

- id: vercel.ai-sdk
  name: Vercel AI SDK
  category: orchestration
  lockin: portable
  assessment:
    interface: 0
    data: 0
    behaviour: 0
  binding: []
  why: >
    Open source and runs anywhere Node does; nothing about it requires the platform
    it is named after. Listed precisely so the report can say so. A scan that flags
    everything it recognises is a scan nobody believes twice.
  detect:
    npm: [ai, "@ai-sdk/react", "@ai-sdk/provider", "@ai-sdk/openai", "@ai-sdk/anthropic"]
  alternatives:
    - name: Keep it
      kind: no change
      compat: "It already runs wherever you run it."
      effort: low
      loses: >
        Nothing. Note only that its provider modules are where a gateway or a hosted
        provider gets configured — the library is portable, the configuration is
        where the binding lives.
  verified: 2026-09-25
