# punkt-lockin catalog — vector stores, retrieval and RAG plumbing

- id: pinecone
  name: Pinecone
  category: vector-store
  lockin: friction
  assessment:   # METHODOLOGY.md §2 — the label is derived from these
    interface: 1
    data: 1
    behaviour: 0
  escalates_when: >
    Namespaces are used as a tenancy boundary, or the index is large enough that re-indexing is a project rather than a job.
  binding: [api, data, ops]
  why: >
    Closed SaaS with a proprietary API and no self-hosted build. Your vectors live
    only there. Exit means re-embedding or bulk-exporting and re-indexing elsewhere.
  detect:
    python_import: [pinecone, pinecone_client]
    # `upsert(` was here and is ordinary SQL vocabulary, not a Pinecone signature.
    python_symbol: ["pinecone.Index", "pinecone.Pinecone"]
    requirement: [pinecone, pinecone-client]
    npm: ["@pinecone-database/pinecone"]
    env: [PINECONE_API_KEY, PINECONE_ENVIRONMENT, PINECONE_INDEX]
  alternatives:
    - component: qdrant
      compat: >
        No API compatibility — the client layer is rewritten. Concepts map cleanly:
        index to collection, metadata filter to payload filter.
      effort: medium
      loses: >
        Fully managed scaling and the serverless pricing model. You size and operate
        the cluster, including replication and backups.
    - component: pgvector
      compat: >
        Rewrite to SQL. The strongest option when you already run Postgres and the
        corpus is small to mid-sized.
      effort: medium
      loses: >
        Purpose-built ANN performance at very large scale, and vector-native features
        like built-in hybrid search and sparse vectors.
    - name: Weaviate
      url: https://github.com/weaviate/weaviate
      kind: self-hosted vector database
      compat: Rewrite of the client layer; hybrid search is built in.
      effort: medium
      loses: Managed operations; heavier to run than Qdrant for simple workloads.
  verified: 2026-09-20

- id: qdrant.cloud
  name: Qdrant Cloud
  category: vector-store
  lockin: portable
  assessment:   # METHODOLOGY.md §2 — the label is derived from these
    interface: 0
    data: 0
    behaviour: 0
  binding: [ops]
  why: >
    The engine is open source and the API is identical to the self-hosted build.
    You are buying operations, and a snapshot restore moves you in-house.
  detect:
    python_import: [qdrant_client]
    requirement: [qdrant-client]
    npm: ["@qdrant/js-client-rest"]
    env: [QDRANT_URL, QDRANT_API_KEY]
  alternatives:
    - name: Qdrant, self-hosted
      url: https://github.com/qdrant/qdrant
      kind: self-hosted vector database
      compat: Same software. Snapshot, restore, repoint the URL.
      effort: low
      loses: Managed backups, scaling and upgrades.
  verified: 2026-09-20

- id: azure.ai-search
  name: Azure AI Search
  category: retrieval
  lockin: locked
  assessment:   # METHODOLOGY.md §2 — the label is derived from these
    interface: 2
    data: 1
    behaviour: 1
  binding: [api, data, ops]
  why: >
    Proprietary index schema, skillsets and semantic ranker. The indexing pipeline —
    not just the queries — is written against Azure-only concepts.
  detect:
    python_import: ["azure.search.documents"]
    python_symbol: [SearchClient, SearchIndexClient, SemanticConfiguration]
    requirement: [azure-search-documents]
    env: [AZURE_SEARCH_ENDPOINT, AZURE_SEARCH_KEY, AZURE_SEARCH_INDEX]
    terraform_resource: [azurerm_search_service]
  alternatives:
    - component: opensearch
      compat: >
        Rewrite of index definitions and queries. Covers lexical, vector and hybrid
        search in one engine, which is the closest functional match.
      effort: high
      loses: >
        Skillset-based document cracking (OCR, entity extraction) has no direct
        equivalent — that pipeline must be rebuilt, typically with separate tools.
    - component: qdrant  # Qdrant + a reranker
      compat: Rewrite; simpler than OpenSearch if you only need vector + filter + rerank.
      effort: medium
      loses: Mature lexical/BM25 search and faceting.
  verified: 2026-09-20

- id: langsmith
  name: LangSmith
  category: llm-observability
  lockin: friction
  assessment:   # METHODOLOGY.md §2 — the label is derived from these
    interface: 1
    data: 1
    behaviour: 0
  binding: [data, ops]
  why: >
    Traces are captured by decorator or callback and stored only in their cloud.
    The instrumentation is shallow and easy to swap; the history is not portable.
  detect:
    python_import: [langsmith]
    python_symbol: ["@traceable", "LangChainTracer"]
    requirement: [langsmith]
    env: [LANGCHAIN_API_KEY, LANGCHAIN_TRACING_V2, LANGSMITH_API_KEY]
  alternatives:
    - name: Langfuse
      url: https://github.com/langfuse/langfuse
      kind: self-hosted LLM observability
      compat: >
        Comparable decorator/callback model. Instrumentation swap is small; existing
        trace history does not come with you.
      effort: low
      loses: >
        Tight coupling with LangChain's own tooling and its hosted eval datasets.
    - name: OpenTelemetry + Phoenix
      url: https://github.com/Arize-ai/phoenix
      kind: self-hosted tracing
      compat: >
        Standards-based (OTel GenAI semantic conventions), so the instrumentation
        itself becomes vendor-neutral going forward.
      effort: medium
      loses: Purpose-built prompt playground and dataset management.
  verified: 2026-09-20

- id: openai.embeddings
  name: OpenAI Embeddings
  category: embeddings
  lockin: locked
  assessment:   # METHODOLOGY.md §2 — the label is derived from these
    interface: 0
    data: 2
    behaviour: 1
  binding: [data, economics]
  why: >
    The hardest AI dependency to leave and the one teams notice last. Vectors from
    one model are meaningless to another, so switching means re-embedding the entire
    corpus and re-tuning every similarity threshold. The lock-in is in your database,
    not your code.
  detect:
    # OPENAI_API_KEY alone was here, so any chat-only app was reported LOCKED into
    # embeddings it never used — and sorted to the top of the report.
    python_symbol: ["text-embedding-3", "text-embedding-ada", "OpenAIEmbeddings"]
  alternatives:
    - component: bge-m3  # BGE-M3 (self-hosted)
      compat: >
        Strong multilingual model including Danish; runs on modest GPU. Requires a
        full re-embed and re-index of the corpus.
      effort: high
      loses: >
        Nothing at the API level — but expect to re-tune retrieval thresholds and
        re-run your evals. Budget for a quality regression test, not a swap.
    - name: multilingual-e5-large
      url: https://huggingface.co/intfloat/multilingual-e5-large
      kind: open embedding model
      compat: Re-embed and re-index; query prefixes differ ("query:" / "passage:").
      effort: high
      loses: Same as above; prefix convention is easy to get wrong and silently hurts recall.
  verified: 2026-09-20

- id: unstructured.api
  name: Unstructured.io API
  category: document-parsing
  lockin: portable
  assessment:   # METHODOLOGY.md §2 — the label is derived from these
    interface: 0
    data: 0
    behaviour: 0
  binding: [ops]
  why: The library is open source; the API is the same code, hosted.
  detect:
    # The open `unstructured` library was a signature for the hosted API, so a
    # self-hosted project was told to migrate to the library it already used.
    python_import: [unstructured_client]
    requirement: [unstructured-client]
    env: [UNSTRUCTURED_API_KEY]
  alternatives:
    - name: unstructured (library, self-hosted)
      url: https://github.com/Unstructured-IO/unstructured
      kind: self-hosted library
      compat: Same project, run locally.
      effort: low
      loses: Managed scaling; you install system deps (poppler, tesseract) yourself.
    - component: docling
      compat: Different API, stronger PDF layout and table handling.
      effort: medium
      loses: Fewer input formats than unstructured's long tail.
  verified: 2026-09-20
