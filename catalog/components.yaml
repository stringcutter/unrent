# Components — the open source things a lockin entry can point at.
#
# An entry's `alternatives` name one of these by id, so a component's facts live in
# exactly one place. They were in seven before this file existed: vLLM was described
# once here and six more times inside vendor entries, which is six places to forget
# when something changes.
#
# Only what a migration needs: what it is called, what kind of thing it is, where it
# lives, its licence, what you give up by choosing it, whether anyone here has run
# it, and whether its maintainers ship a skill so we never have to document their
# API ourselves.

- id: pgvector
  name: pgvector
  repo: https://github.com/pgvector/pgvector
  kind: extension to an existing database
  licence: PostgreSQL (open source)
  loses: >
    Purpose-built ANN performance at large scale, and vector-native features such as
    built-in hybrid search, quantisation and sparse vectors. Index builds compete
    with your transactional workload unless you separate replicas.
  skills: []   # none official; the extension's README is short and stable
  docs: https://github.com/pgvector/pgvector
  verified: 2026-09-20

- id: qdrant
  name: Qdrant
  repo: https://github.com/qdrant/qdrant
  kind: self-hosted vector database
  licence: Apache-2.0
  loses: >
    The operational simplicity of having one datastore. Your vectors and your
    relational data now live in two systems that can disagree.
  skills:
    # Official. The catalog says which component; the vendor's skill says how to use
    # it correctly today. Never encode their API here — that is what goes stale.
    - name: qdrant-advisor
      official: true
      install: npx skills add qdrant/skills/meta/qdrant-advisor
      covers: >
        A meta-skill with live access to nine: SDK usage, scaling, performance,
        search quality, monitoring, deployment, model migration, upgrades.
      url: https://qdrant.tech/documentation/skills/
  verified: 2026-09-20

- id: vllm
  name: vLLM
  repo: https://github.com/vllm-project/vllm
  kind: self-hosted inference server
  licence: Apache-2.0
  loses: >
    Frontier-model quality on reasoning-heavy and long-context tasks, hosted
    moderation, and someone else's on-call rotation.
  skills: []   # none official found
  docs: https://docs.vllm.ai
  verified: 2026-09-20

- id: bge-m3
  name: BGE-M3
  repo: https://huggingface.co/BAAI/bge-m3
  kind: open embedding model
  licence: MIT
  loses: >
    Nothing at the API level, but embedding choice is close to irreversible: changing
    it later means re-embedding and re-indexing everything, and re-tuning thresholds.
    Choose deliberately and write down why.
  skills: []   # none official found
  docs: https://huggingface.co/BAAI/bge-m3
  verified: 2026-09-20

- id: docling
  name: Docling
  repo: https://github.com/docling-project/docling
  kind: self-hosted library
  licence: MIT
  loses: >
    The long tail of input formats that broader tools cover, and the simplicity of a
    one-line text extraction when the documents do not need this.
  skills: []   # none official found
  docs: https://docling-project.github.io/docling/
  verified: 2026-09-20

- id: pydantic-ai
  name: Pydantic AI
  repo: https://github.com/pydantic/pydantic-ai
  kind: library
  licence: MIT
  loses: >
    The batteries a larger framework includes — retrieval abstractions, prebuilt
    integrations, hosted tracing — which you now choose yourself. For most services
    that is a gain, but it is a real difference in time-to-first-demo.
  skills:
    - name: building-pydantic-ai-agents
      official: true
      install: npx skills add pydantic/skills
      covers: "Tools, capabilities, streaming, testing."
      url: https://github.com/pydantic/skills
  verified: 2026-09-20

- id: opensearch
  name: OpenSearch
  repo: https://github.com/opensearch-project/OpenSearch
  kind: self-hosted search engine
  licence: Apache-2.0
  loses: >
    Simplicity. It is a distributed system with its own failure modes, and tuning
    hybrid ranking is a real project rather than a configuration change. Overkill
    unless lexical matching genuinely matters.
  skills: []   # none official found
  docs: https://opensearch.org/docs/latest/
  verified: 2026-09-20

# ---------------------------------------------------------------------------
# Candidates: in the catalog so the option set is not one person's recall, but
# NOT assessed and never recommended. A candidate carries only checkable facts —
# name, role, licence, repository. No selects_when, no avoid_when, no loses,
# because inventing those is how a catalog becomes a listicle.
#
# Promote one by running it and writing the assessment. `architect survey` fetches
# the activity facts; it needs GitHub API access, which some networks block.
# ---------------------------------------------------------------------------

