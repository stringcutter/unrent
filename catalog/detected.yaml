- id: langchain
  name: LangChain
  category: orchestration
  tier: detected
  binds: >
    Open source and portable in itself. Listed because its abstractions decide which
    providers a codebase reaches for, and because a scanner sees the framework rather
    than the service behind it.
  binding: [api]
  detect:
    npm: [langchain, "@langchain/core", "@langchain/openai", "@langchain/community"]
    requirement: [langchain, langchain-core, langchain-community, langgraph]
    python_import: [langchain, langchain_core, langgraph]
  listed: 2026-09-25

- id: llamaindex
  name: LlamaIndex
  category: orchestration
  tier: detected
  binds: >
    Open source retrieval framework. Same note as LangChain: portable itself, but it
    is where the provider and store choices are actually made.
  binding: [api]
  detect:
    npm: [llamaindex]
    requirement: [llama-index, llama-index-core]
    python_import: [llama_index]
  listed: 2026-09-25

- id: cloudflare-ai
  name: Cloudflare Workers AI
  category: llm-inference
  tier: detected
  binds: >
    Inference bound to their edge runtime, reached through a Worker binding rather
    than an HTTP client. Vectorize and R2 usually come with it.
  binding: [api, ops]
  detect:
    # `wrangler` was here, which is the CLI for every Workers project.
    npm: ["@cloudflare/ai"]
    env: [CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN]
  listed: 2026-09-25

