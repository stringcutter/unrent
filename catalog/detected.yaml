# Detected, not assessed.
#
# Every entry here says one thing: you depend on this, and here is what it binds you
# through. No lock-in label, no axes, no alternative — because nobody has run these,
# and inventing the rest is how a catalog stops being worth reading.
#
# The signatures are facts: a package name is a package name. The `binds` line is a
# short, documentable statement of what kind of dependency it is, not a judgement of
# how bad it is.
#
# This tier exists because coverage is the binding constraint. A scan that returns
# nothing gets uninstalled the same day, and "you depend on Clerk for auth, nobody
# here has assessed the exit" is worth far more than silence. Promote one by running
# it, scoring the axes, and naming an alternative someone has used.

- id: supabase
  name: Supabase
  category: backend-platform
  tier: detected
  binds: >
    Postgres with auth, storage, realtime and edge functions layered on. The database
    underneath is standard Postgres; the layers above it are not.
  binding: [api, data, ops]
  detect:
    npm: ["@supabase/supabase-js", "@supabase/ssr", "@supabase/auth-helpers-nextjs"]
    requirement: [supabase]
    env: [SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_URL]
  listed: 2026-09-25

- id: clerk
  name: Clerk
  category: auth
  tier: detected
  binds: >
    Hosted authentication and user management. User records live with the provider,
    and session handling is woven through middleware and route guards.
  binding: [api, data]
  detect:
    npm: ["@clerk/nextjs", "@clerk/clerk-react", "@clerk/backend", "@clerk/clerk-sdk-node"]
    env: [CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY]
  listed: 2026-09-25

- id: neon
  name: Neon
  category: database
  tier: detected
  binds: >
    Serverless Postgres. The wire protocol is Postgres, but the serverless driver and
    branching workflow are theirs.
  binding: [api, ops]
  detect:
    npm: ["@neondatabase/serverless"]
    requirement: [neon, psycopg-neon]
    env: [NEON_DATABASE_URL, NEON_API_KEY]
  listed: 2026-09-25

- id: convex
  name: Convex
  category: backend-platform
  tier: detected
  binds: >
    Reactive backend with its own query language, schema and function runtime. The
    application logic lives inside their model rather than beside it.
  binding: [api, data, ops]
  detect:
    npm: [convex, "@convex-dev/auth"]
    env: [CONVEX_DEPLOYMENT, NEXT_PUBLIC_CONVEX_URL]
  listed: 2026-09-25

- id: firebase
  name: Firebase
  category: backend-platform
  tier: detected
  binds: >
    Datastore, auth and hosting under one SDK. The datastore's document model and
    security rules have no direct equivalent outside it.
  binding: [api, data, ops]
  detect:
    npm: [firebase, firebase-admin, "@firebase/app"]
    requirement: [firebase-admin, google-cloud-firestore]
    env: [FIREBASE_API_KEY, FIREBASE_PROJECT_ID]
  listed: 2026-09-25

- id: upstash
  name: Upstash
  category: database
  tier: detected
  binds: >
    Serverless Redis and vector search over HTTP. Redis commands are standard; the
    HTTP transport and the vector product are not.
  binding: [api, data]
  detect:
    npm: ["@upstash/redis", "@upstash/vector", "@upstash/ratelimit"]
    requirement: [upstash-redis]
    env: [UPSTASH_REDIS_REST_URL, UPSTASH_VECTOR_REST_URL]
  listed: 2026-09-25

- id: replicate
  name: Replicate
  category: model-hosting
  tier: detected
  binds: >
    Hosted inference for open-weight models, billed per run. The weights are usually
    open; the deployment, versioning and scaling are theirs.
  binding: [api, ops, economics]
  detect:
    npm: [replicate]
    requirement: [replicate]
    env: [REPLICATE_API_TOKEN]
  listed: 2026-09-25

- id: modal
  name: Modal
  category: model-hosting
  tier: detected
  binds: >
    Serverless GPU compute with its own decorators and deployment model. Functions
    are written against their runtime rather than packaged as plain containers.
  binding: [api, ops]
  detect:
    requirement: [modal]
    python_import: [modal]
    python_symbol: ["modal.App", "@app.function", "modal.Image"]
    env: [MODAL_TOKEN_ID, MODAL_TOKEN_SECRET]
  listed: 2026-09-25

- id: groq
  name: Groq
  category: llm-inference
  tier: detected
  binds: >
    Hosted inference for open-weight models on their own hardware. The API is
